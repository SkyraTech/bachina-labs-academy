<div class="form-dialog-card" role="dialog" aria-modal="true" aria-labelledby="form-dialog-title">
  <!-- Dialog Header -->
  <div class="dialog-header">
    <div class="header-content">
      <h2 id="form-dialog-title" class="dialog-title">{{ data.title }}</h2>
      @if (data.description) {
        <p class="dialog-description">{{ data.description }}</p>
      }
    </div>

    <button
      type="button"
      (click)="onCancel()"
      aria-label="Close dialog"
      class="dialog-close-btn"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Form Body -->
  <div class="dialog-body">
    <app-dynamic-form
      [fields]="data.fields"
      [actions]="data.actions ?? [
        { id: 'cancel', label: 'Cancel', type: 'cancel', variant: 'secondary' },
        { id: 'submit', label: 'Save', type: 'submit', variant: 'brand' }
      ]"
      (formSubmit)="onFormSubmit($event)"
      (formCancel)="onCancel()"
    ></app-dynamic-form>
  </div>
</div>
