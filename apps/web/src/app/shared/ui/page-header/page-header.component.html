<header class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
  <div>
    @if (eyebrow()) {
      <p class="text-xs font-semibold tracking-wider uppercase text-[var(--color-brand)] mb-1">
        {{ eyebrow() }}
      </p>
    }
    <h1 class="text-2xl font-bold tracking-tight text-[var(--color-text)] sm:text-3xl">
      {{ title() }}
    </h1>
    @if (description()) {
      <p class="mt-1 text-sm text-[var(--color-text-secondary)]">
        {{ description() }}
      </p>
    }
  </div>
  <div class="flex items-center gap-2 empty:hidden">
    <ng-content select="[actions]"></ng-content>
  </div>
</header>
