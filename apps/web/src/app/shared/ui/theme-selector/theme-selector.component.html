<div class="theme-pill-track" role="radiogroup" aria-label="Theme selection">
  @for (opt of options; track opt.mode) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="themeService.mode() === opt.mode"
      [attr.aria-label]="opt.label + ' mode'"
      [title]="opt.label + ' mode'"
      (click)="setTheme(opt.mode)"
      class="theme-btn"
      [class.active]="themeService.mode() === opt.mode"
    >
      @switch (opt.mode) {
        @case ('light') {
          <svg class="theme-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m14.14-14.14l-1.41 1.41" />
          </svg>
        }
        @case ('dark') {
          <svg class="theme-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
          </svg>
        }
        @case ('system') {
          <svg class="theme-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2" stroke-linecap="round" />
            <path stroke-linecap="round" d="M8 21h8m-4-4v4" />
          </svg>
        }
      }
    </button>
  }
</div>
