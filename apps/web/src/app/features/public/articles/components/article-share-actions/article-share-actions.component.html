<div class="article-share-actions flex flex-wrap items-center gap-3" aria-label="Article sharing options">
  <!-- Copy Whole Article Link -->
  <button
    type="button"
    data-testid="reader-copy-link-btn"
    (click)="copyLink()"
    class="share-action-btn inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs font-semibold border border-[var(--color-border)] bg-[var(--color-surface)] text-[var(--color-text)] hover:border-[var(--color-brand)] hover:text-[var(--color-brand)] transition-colors focus:outline-hidden focus-visible:ring-2 focus-visible:ring-[var(--color-brand)] cursor-pointer"
    aria-label="Copy article link to clipboard"
  >
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
    </svg>
    <span>Copy Link</span>
  </button>

  <!-- Optional Section Copy Link -->
  @if (activeHeadingId()) {
    <button
      type="button"
      data-testid="reader-copy-section-btn"
      (click)="copySectionLink()"
      class="share-action-btn inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs font-semibold border border-[var(--color-border)] bg-[var(--color-surface)] text-[var(--color-text-secondary)] hover:border-[var(--color-brand)] hover:text-[var(--color-brand)] transition-colors focus:outline-hidden focus-visible:ring-2 focus-visible:ring-[var(--color-brand)] cursor-pointer"
      aria-label="Copy link to current section"
      [title]="'Copy deep link to section #' + activeHeadingId()"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
      </svg>
      <span>Copy Section Link</span>
    </button>
  }

  <!-- Native Browser Share Dialog -->
  @if (hasNativeShare()) {
    <button
      type="button"
      data-testid="reader-native-share-btn"
      (click)="shareNative()"
      class="share-action-btn inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs font-semibold border border-[var(--color-border)] bg-[var(--color-surface)] text-[var(--color-text)] hover:border-[var(--color-brand)] hover:text-[var(--color-brand)] transition-colors focus:outline-hidden focus-visible:ring-2 focus-visible:ring-[var(--color-brand)] cursor-pointer"
      aria-label="Share article via system dialog"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
      </svg>
      <span>Share</span>
    </button>
  }

  <!-- Live Status Announcement -->
  @if (shareStatus()) {
    <span
      role="status"
      aria-live="polite"
      data-testid="reader-share-status"
      class="text-xs font-medium px-2.5 py-1 rounded-md bg-[var(--color-brand-surface)] text-[var(--color-brand-deep)] transition-opacity"
    >
      {{ shareStatus() }}
    </span>
  }

  <!-- Accessible Manual Copy Fallback when Clipboard API rejects or is unavailable -->
  @if (showManualCopy() && manualCopyUrl()) {
    <div
      data-testid="reader-manual-copy-box"
      class="w-full mt-2 flex flex-col sm:flex-row items-stretch sm:items-center gap-2 p-2.5 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)]"
      role="region"
      aria-label="Manual link copy field"
    >
      <label for="manual-share-url-input" class="sr-only">Article share link</label>
      <input
        id="manual-share-url-input"
        data-testid="reader-manual-copy-input"
        type="text"
        readonly
        [value]="manualCopyUrl()"
        (focus)="$any($event.target).select()"
        class="grow px-3 py-1.5 text-xs font-mono rounded-lg border border-[var(--color-border)] bg-[var(--color-workspace-bg)] text-[var(--color-text)] focus:outline-hidden focus:ring-2 focus:ring-[var(--color-brand)]"
      />
      <span class="text-[11px] text-[var(--color-text-muted)] sm:whitespace-nowrap">
        Press Ctrl+C to copy
      </span>
    </div>
  }
</div>
