<div class="space-y-1.5">
  <div class="flex items-center justify-between">
    <label for="category-select" class="block text-xs font-semibold text-[var(--color-text)]">
      Category
    </label>
    @if (selectedCategoryId() && !disabled()) {
      <button
        type="button"
        (click)="clearCategory()"
        data-testid="clear-category-btn"
        class="text-[11px] font-medium text-[var(--color-brand)] hover:underline cursor-pointer"
        aria-label="Clear selected category"
      >
        Clear
      </button>
    }
  </div>

  @if (loading()) {
    <div
      class="flex items-center gap-2 p-2.5 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] text-xs text-[var(--color-text-muted)] animate-pulse"
      data-testid="category-loading"
      aria-busy="true"
    >
      <div class="w-4 h-4 rounded-full border-2 border-[var(--color-brand)] border-t-transparent animate-spin"></div>
      <span>Loading available categories...</span>
    </div>
  } @else if (error()) {
    <div
      class="p-2.5 rounded-xl border border-red-500/20 bg-red-500/10 text-xs text-red-600 dark:text-red-400 flex items-center justify-between gap-2"
      data-testid="category-error"
      role="alert"
    >
      <span>{{ error() }}</span>
      <button
        type="button"
        (click)="loadCategories()"
        data-testid="category-retry-btn"
        class="px-2 py-0.5 rounded font-semibold bg-red-500/20 hover:bg-red-500/30 text-xs transition-colors cursor-pointer"
      >
        Retry
      </button>
    </div>
  } @else if (categories().length === 0) {
    <div
      class="p-2.5 rounded-xl border border-dashed border-[var(--color-border)] bg-[var(--color-workspace-bg)] text-xs text-[var(--color-text-muted)] leading-relaxed"
      data-testid="category-empty"
    >
      No categories are available yet. An administrator can create categories.
    </div>
  } @else {
    <div class="relative">
      <select
        id="category-select"
        data-testid="category-select"
        [ngModel]="selectedCategoryId() ?? 'null'"
        [ngModelOptions]="{standalone: true}"
        [disabled]="disabled()"
        (ngModelChange)="onSelectModelChange($event)"
        (change)="onSelectChange($event)"
        class="w-full px-3 py-2 text-xs rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)] cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      >
        <option value="null">-- Select Category (None) --</option>
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>
  }
</div>
