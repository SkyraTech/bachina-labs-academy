<div class="space-y-6">
  <!-- Title & Subtitle -->
  <div class="text-center space-y-2">
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-[var(--color-text)]">
      Welcome back
    </h1>
    <p class="text-sm text-[var(--color-text-secondary)]">
      Sign in to access your technical articles and author studio
    </p>
  </div>

  <!-- Social / OAuth Quick Actions (Coming Soon) -->
  <div class="grid grid-cols-2 gap-3 opacity-60">
    <button
      type="button"
      disabled
      class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] text-sm font-medium text-[var(--color-text-muted)] cursor-not-allowed shadow-xs"
    >
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
      </svg>
      <span>GitHub (Soon)</span>
    </button>

    <button
      type="button"
      disabled
      class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] text-sm font-medium text-[var(--color-text-muted)] cursor-not-allowed shadow-xs"
    >
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
      </svg>
      <span>Google (Soon)</span>
    </button>
  </div>

  <!-- Divider -->
  <div class="relative flex items-center justify-center">
    <div class="w-full border-t border-[var(--color-border)]"></div>
    <span class="absolute px-3 bg-[var(--color-surface)] text-xs text-[var(--color-text-muted)] uppercase tracking-wider">
      sign in with email
    </span>
  </div>

  <!-- Mock Form Fields with Associated Labels -->
  <div class="space-y-4">
    <div>
      <label for="login-email-input" class="block text-xs font-semibold text-[var(--color-text-secondary)] mb-1.5 uppercase tracking-wider">
        Email address
      </label>
      <input
        id="login-email-input"
        type="email"
        placeholder="engineer@domain.com"
        disabled
        class="w-full px-4 py-3 rounded-xl border border-[var(--color-border)] bg-[var(--color-bg)] text-[var(--color-text)] placeholder:text-[var(--color-text-muted)] text-sm focus:outline-none focus:border-[var(--color-brand)] focus:ring-2 focus:ring-[var(--color-brand)]/20 transition-all opacity-85"
      />
    </div>

    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label for="login-password-input" class="block text-xs font-semibold text-[var(--color-text-secondary)] uppercase tracking-wider">
          Password
        </label>
        <span class="text-xs text-[var(--color-brand)] hover:underline cursor-pointer">Forgot password?</span>
      </div>
      <input
        id="login-password-input"
        type="password"
        value="••••••••••••"
        disabled
        class="w-full px-4 py-3 rounded-xl border border-[var(--color-border)] bg-[var(--color-bg)] text-[var(--color-text)] text-sm focus:outline-none focus:border-[var(--color-brand)] focus:ring-2 focus:ring-[var(--color-brand)]/20 transition-all opacity-85"
      />
    </div>

    <button
      type="button"
      class="w-full py-3.5 px-4 rounded-xl font-semibold text-sm text-white shadow-lg shadow-orange-500/25 transition-all cursor-pointer"
      style="background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);"
    >
      Sign in with Email
    </button>
  </div>

  <!-- Active Security Infrastructure Pill -->
  <div class="flex items-center justify-center gap-2 py-2 px-3 rounded-xl bg-[var(--color-brand-surface)] border border-[var(--color-brand-muted)] text-[var(--color-brand-deep)] text-xs font-medium">
    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
    </svg>
    <span>End-to-End Encrypted Session</span>
  </div>

  <!-- Switch to Register -->
  <div class="text-center text-sm text-[var(--color-text-secondary)] pt-2">
    Don't have an account?
    <a routerLink="/register" class="text-[var(--color-brand)] hover:underline font-semibold ml-1">
      Create account
    </a>
  </div>
</div>
