></app-page-header>

    description="Profile preference controls will be integrated in subsequent phases. Active devices and session revocation are available now under Account Security."

      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
