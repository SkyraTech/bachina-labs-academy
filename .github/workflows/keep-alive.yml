name: Production Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier spin down (15m inactivity threshold)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -sS -f --connect-timeout 15 -m 60 https://bachina-labs-academy.onrender.com/health

      - name: Ping Vercel Frontend
        run: |
          curl -sS -f --connect-timeout 15 -m 60 https://bachina-labs-academy.vercel.app/health
